name: CI

# Install, build (tsc, which is also the typecheck) and test, with the scripts in
# package.json.
#
# Runs on every PR into main and on every push to main. The push run is the only
# one that tests the merge commit itself: PRs are squash-merged without being
# rebased first, so two PRs that each pass can still break main together.
#
# pr-agent-automerge.yml listens for this workflow by name and merges only when
# the job below has passed on the PR's latest commit. Keep `name: CI`, and keep
# the job name the same as REQUIRED_CHECKS in that file and as the required
# status check in main's branch protection.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels that PR's still-running run: only the newest commit
# can be merged, so the older run's verdict is worthless. Runs on main are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The oldest Node line still maintained. package.json's engines allows
          # older ones, but nothing here is tested on them.
          node-version: 22
          cache: npm
      # Before `npm ci`, so a change that needs an exponential-sdk version nobody
      # has published yet fails here with the reason and the fix, not as a
      # lockfile-sync error or a tarball 404 further down.
      - name: exponential-sdk version is published on npm
        run: node .github/scripts/check-sdk-pin.mjs
      - run: npm ci
      # `build` is tsc, so this is the typecheck too: package.json has no separate
      # typecheck or lint script.
      - run: npm run build
      # `test` builds again, then runs node:test over test/*.test.mjs against dist.
      - run: npm test
